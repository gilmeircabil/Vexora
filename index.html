<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Block Blast! - Classic Block Puzzle</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="game-container">
    <!-- Header -->
    <header class="game-header">
      <div class="title-wrap">
        <h1 class="game-title">
          <span class="letter b1">B</span><span class="letter b2">L</span><span class="letter b3">O</span><span class="letter b4">C</span><span class="letter b5">K</span>
          <span class="space"></span>
          <span class="letter b6">B</span><span class="letter b7">L</span><span class="letter b8">A</span><span class="letter b9">S</span><span class="letter b10">T</span>
        </h1>
        <span class="wasm-badge" title="Powered by WebAssembly Text (WAT) Assembly Engine">⚡ WAT / WASM</span>
      </div>

      <div class="header-controls">
        <button id="sound-btn" class="icon-btn" title="Toggle Sound" aria-label="Toggle Sound">
          <svg class="sound-on-icon" viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
            <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
          </svg>
          <svg class="sound-off-icon hidden" viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
            <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27l4.73 4.73H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
          </svg>
        </button>

        <button id="restart-btn" class="icon-btn" title="Restart Game" aria-label="Restart Game">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
            <path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Scoreboard -->
    <div class="scoreboard">
      <div class="score-card current-score-card">
        <span class="score-label">SCORE</span>
        <span id="score-val" class="score-number">0</span>
      </div>
      <div class="score-card high-score-card">
        <span class="score-label">BEST</span>
        <div class="high-score-wrap">
          <svg class="trophy-icon" viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
            <path d="M19 5h-2V3H7v2H5c-1.1 0-2 .9-2 2v1c0 2.55 1.92 4.63 4.39 4.94A5.01 5.01 0 0 0 11 15.9V19H7v2h10v-2h-4v-3.1a5.01 5.01 0 0 0 3.61-2.96C19.08 12.63 21 10.55 21 8V7c0-1.1-.9-2-2-2zM5 8V7h2v3.82C5.84 10.4 5 9.3 5 8zm14 0c0 1.3-.84 2.4-2 2.82V7h2v1z"/>
          </svg>
          <span id="high-score-val" class="score-number">0</span>
        </div>
      </div>
    </div>

    <!-- Combo & Feedback Banner -->
    <div class="feedback-container">
      <div id="combo-banner" class="combo-banner hidden">
        <span class="combo-text">COMBO x2!</span>
      </div>
    </div>

    <!-- Game Board (8x8) -->
    <div class="board-wrapper">
      <div id="board" class="board" role="grid" aria-label="Block blast puzzle board">
        <!-- 64 cells generated dynamically by JavaScript -->
      </div>
    </div>

    <!-- Pieces Dock Tray -->
    <div class="dock-container">
      <div class="dock" id="pieces-dock">
        <div class="dock-slot" data-slot="0"></div>
        <div class="dock-slot" data-slot="1"></div>
        <div class="dock-slot" data-slot="2"></div>
      </div>
    </div>

    <!-- Instructions / Tips -->
    <div class="hint-text">
      Drag or tap blocks into the grid. Clear rows & columns to blast!
    </div>
  </div>

  <!-- Game Over Modal Overlay -->
  <div id="game-over-modal" class="modal-overlay hidden">
    <div class="modal-card">
      <div class="modal-header">
        <span class="skull-badge">💥</span>
        <h2>GAME OVER</h2>
      </div>

      <div class="final-scores">
        <div class="modal-score-item">
          <span class="modal-score-label">FINAL SCORE</span>
          <span id="modal-score" class="modal-score-val">0</span>
        </div>
        <div class="modal-score-item">
          <span class="modal-score-label">BEST RECORD</span>
          <span id="modal-high-score" class="modal-score-val">0</span>
        </div>
      </div>

      <div id="new-record-badge" class="new-record-badge hidden">
        🎉 NEW HIGH SCORE! 🎉
      </div>

      <div class="modal-actions">
        <button id="modal-restart-btn" class="primary-btn">
          <span>PLAY AGAIN</span>
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
            <path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46A7.93 7.93 0 0 0 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74A7.93 7.93 0 0 0 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Floating Drag Piece Proxy (for smooth touch & mouse dragging) -->
  <div id="drag-proxy" class="drag-proxy hidden"></div>

  <script src="engine-wasm.js"></script>
  <script src="game.js"></script>
</body>
</html>
